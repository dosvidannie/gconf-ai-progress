<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Сравнение версий — Три недели с AI</title>
  <style>
    :root {
      --ink: #0a0a09;
      --panel: #121210;
      --paper: #f0eee7;
      --muted: #a9a79f;
      --line: rgba(240, 238, 231, .22);
      --orange: #ff643f;
      --lime: #d7f055;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--ink); color: var(--paper); font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { padding: 18px; }
    .compare-header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      margin-bottom: 16px;
    }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 58px); line-height: .9; letter-spacing: -.055em; font-weight: 400; text-transform: uppercase; }
    h1 span { color: var(--orange); }
    .hint { margin: 0; max-width: 470px; color: var(--muted); font-size: 13px; line-height: 1.4; text-align: right; }
    .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; height: calc(100vh - 116px); min-height: 560px; }
    .version {
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
    }
    .version-bar { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 13px 16px; border-bottom: 1px solid var(--line); }
    .version-title { display: flex; align-items: center; gap: 10px; font-size: 12px; letter-spacing: .09em; text-transform: uppercase; }
    .version-title::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--orange); }
    .version.current .version-title::before { background: var(--lime); }
    a { color: var(--paper); font-size: 11px; letter-spacing: .06em; text-decoration: none; text-transform: uppercase; }
    a:hover, a:focus-visible { color: var(--lime); outline: none; }
    iframe { width: 100%; height: 100%; border: 0; background: var(--ink); }
    @media (max-width: 900px) {
      body { padding: 12px; }
      .compare-header { display: block; }
      .hint { margin-top: 12px; text-align: left; }
      .compare-grid { grid-template-columns: 1fr; height: auto; min-height: 0; }
      .version { height: 78vh; min-height: 520px; }
    }
  </style>
</head>
<body>
  <header class="compare-header">
    <h1>Сравнение <span>версий</span></h1>
    <p class="hint">Обе страницы можно прокручивать независимо. Для просмотра на весь экран используйте ссылку «Открыть отдельно».</p>
  </header>
  <main class="compare-grid">
    <section class="version">
      <div class="version-bar">
        <div class="version-title">Предыдущая версия</div>
        <a href="../versions/initial/" target="_blank" rel="noopener">Открыть отдельно ↗</a>
      </div>
      <iframe src="../versions/initial/" title="Предыдущая версия сайта"></iframe>
    </section>
    <section class="version current">
      <div class="version-bar">
        <div class="version-title">Текущая версия</div>
        <a href="../" target="_blank" rel="noopener">Открыть отдельно ↗</a>
      </div>
      <iframe src="../" title="Текущая версия сайта"></iframe>
    </section>
  </main>
</body>
</html>
